<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650" width="1080" height="650" role="img" aria-labelledby="title desc">
<title id="title">audition_ros2 node interaction diagram</title>
<desc id="desc">Audio capture feeds spatial perception, semantic perception and the canonical acoustic scene. Optional attention, multimodal fusion, acoustic memory and Nav2 plugins consume scene observations.</desc>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52677a"/></marker>
<style>
text{font-family:DejaVu Sans,Arial,sans-serif;fill:#183348}.t{font-size:22px;font-weight:bold}.s{font-size:12px}.l{font-size:14px;font-weight:bold}.p{fill:#eaf3fb;stroke:#457aaa;stroke-width:1.7}.c{fill:#e9f6ec;stroke:#4f9371;stroke-width:1.7}.b{fill:#fff3e5;stroke:#b8853b;stroke-width:1.7}.e{fill:none;stroke:#52677a;stroke-width:1.8;marker-end:url(#a)}.d{stroke-dasharray:6 4}.w{fill:#fff}</style>
</defs>
<rect width="1080" height="650" fill="#fff"/>
<text x="540" y="34" text-anchor="middle" class="t">audition_ros2 — node interactions</text>
<text x="540" y="56" text-anchor="middle" class="s">Solid: data or commands · Dashed: movement feedback · Boxes are logical nodes or plugins</text>
<rect class="p" x="30" y="112" width="170" height="70" rx="10"/><text x="115" y="140" text-anchor="middle" class="l">audio_capture</text><text x="115" y="160" text-anchor="middle" class="s">ALSA / WAV → PCM</text>
<rect class="p" x="255" y="112" width="190" height="70" rx="10"/><text x="350" y="140" text-anchor="middle" class="l">spatial_perception</text><text x="350" y="160" text-anchor="middle" class="s">ODAS, tracks, separation</text>
<rect class="p" x="500" y="112" width="200" height="70" rx="10"/><text x="600" y="140" text-anchor="middle" class="l">semantic_perception</text><text x="600" y="160" text-anchor="middle" class="s">classes, VAD, ASR</text>
<rect class="c" x="770" y="112" width="210" height="70" rx="10"/><text x="875" y="140" text-anchor="middle" class="l">acoustic_scene</text><text x="875" y="160" text-anchor="middle" class="s">canonical state / TTL</text>
<path class="e" d="M200 147H255"/><text x="228" y="136" text-anchor="middle" class="s">PCM</text>
<path class="e" d="M445 147H500"/><text x="470" y="135" text-anchor="middle" class="s">mono</text>
<path class="e" d="M700 147H770"/><text x="736" y="135" text-anchor="middle" class="s">events</text>
<path class="e" d="M350 112V82H875V112"/><text x="600" y="77" text-anchor="middle" class="s">spatial tracks + source identity</text>
<rect class="c" x="90" y="315" width="200" height="68" rx="10"/><text x="190" y="343" text-anchor="middle" class="l">acoustic_memory</text><text x="190" y="362" text-anchor="middle" class="s">history, room context</text>
<rect class="c" x="410" y="315" width="230" height="68" rx="10"/><text x="525" y="343" text-anchor="middle" class="l">multimodal_fusion</text><text x="525" y="362" text-anchor="middle" class="s">tf2, OAK-D, radar</text>
<rect class="b" x="735" y="315" width="230" height="68" rx="10"/><text x="850" y="343" text-anchor="middle" class="l">attention_manager</text><text x="850" y="362" text-anchor="middle" class="s">look / investigate actions</text>
<path class="e" d="M875 182V244H190V315"/><path class="e" d="M875 244H525V315"/><path class="e" d="M875 244V315"/>
<text x="680" y="237" text-anchor="middle" class="s">public AcousticScene / events</text>
<rect class="p" x="400" y="455" width="250" height="68" rx="10"/><text x="525" y="481" text-anchor="middle" class="l">TF2 · OAK-D · Radar</text><text x="525" y="500" text-anchor="middle" class="s">independent external observations</text>
<path class="e" d="M525 455V383"/>
<rect class="b" x="725" y="455" width="240" height="68" rx="10"/><text x="845" y="481" text-anchor="middle" class="l">Nav2</text><text x="845" y="500" text-anchor="middle" class="s">existing motion safety stack</text>
<path class="e" d="M850 383V455"/>
<rect class="b" x="105" y="455" width="210" height="68" rx="10"/><text x="210" y="481" text-anchor="middle" class="l">Costmap plugin</text><text x="210" y="500" text-anchor="middle" class="s">metric hypotheses only</text>
<path class="e" d="M410 349H345V455H315"/><path class="e" d="M315 490H725"/>
<path class="e d" d="M845 523V585H115V182"/>
<text x="480" y="575" text-anchor="middle" class="s">Robot movement permits new acoustic measurements</text>
<text x="540" y="625" text-anchor="middle" class="s">Unknown distance ≠ obstacle · Scene owns public event lifecycle · Nav2 layer is optional</text>
</svg>
