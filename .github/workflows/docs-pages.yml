name: Documentation site

on:
  push:
    branches: [main, feat/m0-ros2-foundation]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install Sphinx dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Check diagram viewer syntax
        run: node --check docs/_static/diagram-viewer.js
      - name: Build documentation
        run: |
          sphinx-build -b html --keep-going docs docs/_build/html
          test -s docs/_build/html/index.html
          test -s docs/_build/html/ROADMAP.html
          test -s docs/_build/html/_static/diagram-viewer.js
          grep -q 'diagram-viewer.js' docs/_build/html/index.html
          grep -Eq '(mermaid-diagram|class="mermaid")' docs/_build/html/index.html
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
