name: Sphinx documentation site

on:
  push:
    branches: [documentation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audition-ros2-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Sphinx website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Render Sphinx and Mermaid documentation
        run: |
          sphinx-build -b html --keep-going docs docs/_build/html
          test -s docs/_build/html/index.html
          test -s docs/_build/html/ROADMAP.html
          test -s docs/_build/html/ROS2_ARCHITECTURE.html
          test -s docs/_build/html/LIBAUDITION_INTEGRATION.html
          grep -Eq '(mermaid-diagram|class="mermaid")' docs/_build/html/index.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
