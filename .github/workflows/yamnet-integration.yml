name: Native libaudition YAMNet adapter

on:
  pull_request:
  workflow_dispatch:

jobs:
  native-yamnet:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git build-essential cmake ninja-build ca-certificates unzip \
            python3-colcon-common-extensions \
            python3-pytest python3-yaml ros-humble-ament-cmake-pytest \
            ros-humble-ament-cmake-gtest ros-humble-rosidl-default-generators \
            ros-humble-rclcpp ros-humble-rclcpp-components \
            ros-humble-geometry-msgs ros-humble-launch-ros ros-humble-rclpy
      - name: Build pinned native libaudition with YAMNet
        shell: bash
        run: |
          set -eo pipefail
          git init /tmp/libaudition
          git -C /tmp/libaudition remote add origin https://github.com/ARDev1161/libaudition.git
          git -C /tmp/libaudition fetch --depth 1 origin 72fc4040f0e21f1271a6b14c787cc8fa73cb3ad3
          git -C /tmp/libaudition checkout --detach FETCH_HEAD
          cmake -S /tmp/libaudition -B /tmp/libaudition-yamnet -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/audition-install \
            -DLIBAUDITION_WITH_YAMNET=ON \
            -DLIBAUDITION_WITH_SPDLOG=OFF \
            -DLIBAUDITION_BUILD_TESTS=OFF \
            -DLIBAUDITION_BUILD_EXAMPLES=OFF \
            -DLIBAUDITION_BUILD_QT_DEMO=OFF \
            -DLIBAUDITION_FETCH_DEPENDENCIES=ON -DBUILD_TESTING=OFF
          cmake --build /tmp/libaudition-yamnet --parallel 3
          cmake --install /tmp/libaudition-yamnet
      - name: Compile ROS semantic integration and run deterministic native tests
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          export CMAKE_PREFIX_PATH="/tmp/audition-install:${CMAKE_PREFIX_PATH}"
          export LD_LIBRARY_PATH="/tmp/audition-install/lib:${LD_LIBRARY_PATH:-}"
          colcon build --event-handlers console_direct+ \
            --cmake-args -DAUDITION_ROS2_WITH_SEMANTIC=ON \
                         -DAUDITION_ROS2_WITH_YAMNET=ON -DBUILD_TESTING=ON
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
          python3 -m py_compile audition_bringup/launch/m2_wav_pipeline.launch.py
