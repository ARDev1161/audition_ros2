name: ROS 2 Humble CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "feat/**"]

jobs:
  humble:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libasound2-dev \
            python3-colcon-common-extensions \
            python3-pytest \
            python3-yaml \
            ros-humble-ament-cmake-pytest \
            ros-humble-ament-cmake-gtest \
            ros-humble-rosidl-default-generators \
            ros-humble-geometry-msgs \
            ros-humble-nav-msgs \
            ros-humble-diagnostic-msgs \
            ros-humble-visualization-msgs \
            ros-humble-tf2-ros \
            ros-humble-rclpy \
            ros-humble-action-msgs \
            ros-humble-rclcpp \
            ros-humble-rclcpp-components \
            ros-humble-launch-ros
      - name: Build all packages
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_direct+ --cmake-args -DBUILD_TESTING=ON -DAUDITION_ROS2_WITH_ALSA=ON
      - name: Run ROS message and WAV parser tests
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
          ros2 interface show audition_msgs/msg/AcousticScene
          ros2 interface show audition_msgs/msg/SourceAudioFrame
          ros2 interface show audition_msgs/msg/SemanticProgress
          ros2 interface show audition_msgs/action/LookAtSound
          ros2 interface show audition_msgs/action/TrackSound
          ros2 interface show audition_msgs/msg/CameraAimProposal
          ros2 interface show audition_msgs/msg/BearingIntersectionCandidateArray
          ros2 interface show audition_msgs/msg/VisualBearingObservationArray
          ros2 interface show audition_msgs/msg/AudioVisualPairHypothesisArray
          ros2 interface show audition_msgs/msg/RadarTrackArray
          ros2 interface show audition_msgs/msg/RadarObservationArray
          ros2 interface show audition_msgs/msg/RadarAudioCandidateArray
      - name: M4 guarded triangulation geometry unit tests
        run: |
          python3 -m unittest discover -s audition_fusion/test -p 'test_*.py' -v

      - name: M4 reproducible adverse AV association benchmark (diagnostic only)
        run: |
          python3 audition_fusion/benchmarks/av_association_benchmark.py
          python3 -m unittest discover -s audition_fusion/test -p 'test_av_groundtruth.py' -v
          python3 -m unittest discover -s audition_fusion/test -p 'test_bearing_groundtruth.py' -v

      - name: M4-C synthetic radar/audio association benchmark (diagnostic only)
        run: |
          python3 audition_fusion/benchmarks/radar_association_benchmark.py
          python3 audition_fusion/benchmarks/radar_temporal_benchmark.py
          python3 -m unittest discover -s audition_fusion/test -p 'test_radar*.py' -v

      - name: M4 independent field manifest contract scoring (synthetic fixture only)
        run: |
          python3 -m unittest discover -s audition_fusion/test -p 'test_field_evaluation.py' -v
          python3 audition_fusion/benchmarks/evaluate_field_manifest.py \
            audition_fusion/test/fixtures/m4_field_contract_example.json \
            > /tmp/audition_m4_field_contract_report.json
          python3 - <<'PY'
          import json
          with open('/tmp/audition_m4_field_contract_report.json', encoding='utf-8') as f:
              report = json.load(f)
          assert report['trial_count'] == 4
          assert report['strategies']['instant_fusion']['tp'] == 1
          assert report['strategies']['instant_fusion']['fp'] == 2
          assert report['strategies']['temporal_fusion']['fp'] == 0
          assert report['strategies']['temporal_fusion']['fn'] == 1
          assert report['physical_validation_claim'] is False
          comparison = report['paired_comparison']
          assert comparison['candidate'] == 'temporal_fusion'
          assert comparison['positive_gain_validated'] is False
          clusters = report['clustered_comparison']
          assert clusters['physical_validation_claim'] is False
          assert clusters['recording_independence_only'] is True
          assert clusters['baselines']['instant_fusion']['bootstrap_95pct_accuracy_interval'] is None
          assert 'direct' in clusters['per_stratum']
          assert 'impostor' in clusters['per_stratum']
          assert clusters['per_stratum']['impostor']['baselines']['instant_fusion']['bootstrap_95pct_accuracy_interval'] is None
          instant = comparison['baseline_comparisons']['instant_fusion']
          assert instant['observable_trials'] == 3
          assert instant['candidate_false_pairs'] == 0
          assert instant['baseline_false_pairs'] == 2
          assert instant['paired_false_pair_delta_per_trial'] == -2/3
          PY

      - name: M4 simulator export ingestion and verified artifact hashes
        run: |
          python3 -m unittest discover -s audition_fusion/test -p 'test_simulation_import.py' -v
          python3 - <<'PY'
          import hashlib, json, pathlib, tempfile, subprocess, sys
          with tempfile.TemporaryDirectory() as work:
              root=pathlib.Path(work)
              recording=root/'capture.dat'
              recording.write_bytes(b'Synthetic contract artifact, not audio')
              sha=hashlib.sha256(recording.read_bytes()).hexdigest()
              candidate={"audio_id":"s1","radar_id":"r1"}
              trial={"trial_id":"one","stratum":"smoke",
                     "truth_source":"simulator_authoritative",
                     "truth":{"observable":True,"pair":candidate},
                     "predictions":{name:{"decision":"pair","pair":candidate}
                                    for name in ("audio_only","radar_only",
                                                 "instant_fusion","temporal_fusion")}}
              export={"format":"audition.simulation-export.v1",
                      "domain":"simulation","dataset_id":"synthetic-cli-test",
                      "scenarios":[{"scenario_id":"s","split":"held_out",
                                    "recording":"capture.dat",
                                    "recording_sha256":sha,"trials":[trial]}]}
              source=root/'export.json'
              source.write_text(json.dumps(export),encoding='utf-8')
              manifest=root/'manifest.json'
              subprocess.run([sys.executable,
                  'audition_fusion/benchmarks/import_simulation_export.py',
                  str(source),'--artifacts-root',str(root),'--out',str(manifest)],
                  check=True)
              provenance=json.loads((root/'manifest.json.provenance.json').read_text())
              assert provenance['domain'] == 'simulation'
              assert provenance['physical_validation_claim'] is False
              assert provenance['simulation_export_sha256'] == hashlib.sha256(
                  source.read_bytes()).hexdigest()
              assert provenance['manifest_sha256'] == hashlib.sha256(
                  manifest.read_bytes()).hexdigest()
              report=subprocess.check_output([sys.executable,
                  'audition_fusion/benchmarks/evaluate_field_manifest.py',
                  str(manifest),'--require-simulation-provenance'])
              result=json.loads(report)
              assert result["strategies"]["temporal_fusion"]["tp"] == 1
              assert result["physical_validation_claim"] is False
              assert result["data_domain"] == "simulation"
              assert result["provenance_verified"] is True
          PY

      - name: M4 adverse conditional geometry audit (known blind spots)
        run: |
          python3 audition_fusion/benchmarks/conditional_geometry_adversarial.py

      - name: M4 common-mode geometry false-confidence audit
        run: |
          python3 -m unittest discover -s audition_fusion/test -p 'test_common_mode_audit.py' -v
          python3 audition_fusion/benchmarks/common_mode_geometry_benchmark.py > /tmp/m4_common_mode.json
          python3 - <<'PY'
          import json
          with open('/tmp/m4_common_mode.json', encoding='utf-8') as f:
              report = json.load(f)
          assert report['physical_validation_claim'] is False
          assert report['metric_position_published'] is False
          assert all(item['admitted'] for item in report['cases'].values())
          assert report['cases']['shared_pose_bias_1m']['position_error_m'] > 0.99
          assert report['cases']['coherent_reflection_image']['position_error_m'] > 3.99
          PY

      - name: Validate launch Python syntax
        run: |
          python3 -m py_compile audition_bringup/launch/m1_wav_pipeline.launch.py audition_bringup/launch/m1_alsa_pipeline.launch.py audition_bringup/launch/m2_wav_pipeline.launch.py audition_bringup/launch/m2_alsa_pipeline.launch.py audition_bringup/launch/m2_profile.launch.py audition_bringup/launch/profile_config.py audition_bringup/launch/m2_capture_session_fixture.launch.py audition_bringup/launch/profile_supervisor.py audition_bringup/launch/profile_supervisor_core.py audition_bringup/launch/profile_audio_flow.py audition_bringup/launch/profile_source_flow.py audition_bringup/launch/profile_semantic_flow.py audition_bringup/launch/m3_attention.launch.py audition_bringup/launch/m3_attention_tf.launch.py audition_bringup/launch/m3_look_at_sound.launch.py audition_bringup/launch/m3_track_sound.launch.py audition_bringup/launch/m3_attention_bearing_ray.launch.py audition_bringup/launch/m3_attention_camera_aim.launch.py audition_bringup/launch/m3_attention_camera_admission.launch.py audition_bringup/launch/m4_bearing_candidates.launch.py audition_bringup/launch/m4_av_pairs.launch.py audition_bringup/launch/m4_pose_evidence.launch.py audition_bringup/launch/m4_fusion_diagnostics.launch.py audition_bringup/launch/m4_radar_adapter.launch.py audition_bringup/launch/m4_radar_diagnostics.launch.py audition_bringup/launch/attention_config.py

      - name: Smoke M3 attention advisory over real ROS graph
        shell: bash
        run: |
          set -eo pipefail
          export ROS_DOMAIN_ID=112
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          cat > /tmp/audition_attention_ci.yaml <<'YAML'
          /**/attention_manager:
            ros__parameters:
              scene_timeout_ms: 500
          YAML
          ros2 launch audition_bringup m3_attention.launch.py \
            audition_namespace:=robot_ci/audition \
            attention_parameters:=/tmp/audition_attention_ci.yaml \
            > /tmp/audition_attention_launch.log 2>&1 &
          launch_pid=$!
          trap 'kill "$launch_pid" 2>/dev/null || true' EXIT
          if ! python3 audition_tests/smoke_attention_graph.py; then
            cat /tmp/audition_attention_launch.log
            exit 1
          fi

